name: release-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-wheel:
    name: Pure candidate wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Qualify Linux browser build
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --ignore-scripts
          npm test -- --reporter=verbose --slowTestThreshold=100
          npm run build
          cd ..
          git diff --exit-code -- src/hermes_realtime/client/static src/hermes_realtime/evidence/disclosure_manifest_v1.json
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      # v10.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: true
      - name: Build hash-identified offline candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; from scripts.release_gate import validate_disclosure_manifest; validate_disclosure_manifest(Path('src'))"
          mkdir -p candidate wheelhouse requirements linux-runtime/wheels
          uv build --wheel --out-dir candidate
          uv export --frozen --group dev --no-emit-project --output-file requirements/linux-null-capture.txt
          python -m pip download --dest wheelhouse --require-hashes -r requirements/linux-null-capture.txt
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/linux-runtime-export.txt"
          python -m pip download --dest linux-runtime/wheels --require-hashes -r "$RUNNER_TEMP/linux-runtime-export.txt"
          printf '# No additional constraints\n' > linux-runtime/constraints.txt
          wheel=$(find candidate -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          sha256sum "$wheel" | tee candidate/candidate-wheel.sha256
          printf 'hermes-realtime==0.0.3 --hash=sha256:%s\n' "$(sha256sum "$wheel" | awk '{print $1}')" > candidate/candidate-requirements.txt
          python -m scripts.qualification_linux_producer --prepare-inputs --input-root . --source-root .
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-realtime-pure-candidate-wheel
          path: |
            candidate/
            requirements/linux-null-capture.txt
            wheelhouse/
            linux-runtime/
            source/
          retention-days: 7

  linux-null-capture:
    name: Linux null capture
    needs: candidate-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hermes-realtime-pure-candidate-wheel
          path: candidate-input
      - name: Produce owned Linux installation and null-capture receipt
        shell: bash
        env:
          HERMES_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p linux-receipt
          python3 -m scripts.qualification_linux_producer \
            --input-root candidate-input --source-root . \
            --output linux-receipt/linux-null-capture-receipt-v1.json
      # v7.0.0; this environment is for portable tests, not the qualified proof.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install the separate portable-check environment
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-input
          sha256sum --check candidate/candidate-wheel.sha256
          python -m venv portable-runtime
          portable-runtime/bin/python -m pip install --no-index --find-links candidate --find-links wheelhouse --require-hashes -r requirements/linux-null-capture.txt -r candidate/candidate-requirements.txt
      - name: Prove Linux null capture
        shell: bash
        run: PATH="$PWD/candidate-input/portable-runtime/bin:$PATH" candidate-input/portable-runtime/bin/python -m pytest -q tests/integration/test_linux_null_capture.py
      - name: Validate portable qualification oracles
        shell: bash
        run: PATH="$PWD/candidate-input/portable-runtime/bin:$PATH" candidate-input/portable-runtime/bin/python -m pytest -q tests/test_evidence_protocol_oracle.py tests/test_spool_crash_qualification.py tests/test_full_purge_cleanup.py tests/test_owned_close_faults.py tests/test_synthetic_fault_matrix.py
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-realtime-linux-null-capture-receipt-v1
          path: linux-receipt/linux-null-capture-receipt-v1.json
          retention-days: 7

  release-candidate:
    name: Hermetic release candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      # v10.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: true
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Provision owner-only Windows test temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testTemp = Join-Path $env:RUNNER_TEMP "hermes-realtime-owner-only-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $testTemp) {
            Remove-Item -LiteralPath $testTemp -Recurse -Force
          }
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Windows CI test-temp authority requires an elevated Administrators token"
          }
          $authoritySid = 'S-1-5-32-544'
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /inheritance:r
          if ($LASTEXITCODE -ne 0) { throw "failed to remove inherited test-temp ACLs" }
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /grant:r "*${authoritySid}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "failed to grant the permitted test-temp authority SID" }
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /setowner "*${authoritySid}"
          if ($LASTEXITCODE -ne 0) { throw "failed to set the permitted test-temp authority SID as owner" }
          $probe = Join-Path $testTemp "owner-inheritance-probe"
          New-Item -ItemType Directory -Path $probe | Out-Null
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'src'); from hermes_realtime.evidence.storage_security import _path_grants_only_owner; paths = tuple(map(Path, sys.argv[1:])); raise SystemExit(not all(_path_grants_only_owner(path) for path in paths))" $testTemp $probe
          if ($LASTEXITCODE -ne 0) { throw "test-temp owner/DACL inheritance is not permitted" }
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction Stop
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run hermetic release gates
        shell: pwsh
        run: python scripts/candidate_e2e_fast_track.py --candidate $env:GITHUB_WORKSPACE
      - name: Remove owner-only Windows test temp
        if: always()
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP "hermes-realtime-owner-only-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $testTemp) {
            Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction Stop
          }

  native-livekit:
    name: Native LiveKit release integration
    needs: candidate-wheel
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      # v10.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: true
          save-cache: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Provision owner-only Windows test temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testTemp = Join-Path $env:RUNNER_TEMP "hermes-realtime-owner-only-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $testTemp) {
            Remove-Item -LiteralPath $testTemp -Recurse -Force
          }
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Windows CI test-temp authority requires an elevated Administrators token"
          }
          $authoritySid = 'S-1-5-32-544'
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /inheritance:r
          if ($LASTEXITCODE -ne 0) { throw "failed to remove inherited test-temp ACLs" }
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /grant:r "*${authoritySid}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "failed to grant the permitted test-temp authority SID" }
          & "$env:SystemRoot\System32\icacls.exe" $testTemp /setowner "*${authoritySid}"
          if ($LASTEXITCODE -ne 0) { throw "failed to set the permitted test-temp authority SID as owner" }
          $probe = Join-Path $testTemp "owner-inheritance-probe"
          New-Item -ItemType Directory -Path $probe | Out-Null
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'src'); from hermes_realtime.evidence.storage_security import _path_grants_only_owner; paths = tuple(map(Path, sys.argv[1:])); raise SystemExit(not all(_path_grants_only_owner(path) for path in paths))" $testTemp $probe
          if ($LASTEXITCODE -ne 0) { throw "test-temp owner/DACL inheritance is not permitted" }
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction Stop
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned local LiveKit server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'livekit_1.13.4_windows_amd64.zip'
          Invoke-WebRequest 'https://github.com/livekit/livekit/releases/download/v1.13.4/livekit_1.13.4_windows_amd64.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'a326e025de516e93dfb3719bcd28e5a4ac16f21bcf1ef562499403ca98cc65fe'
          if ($actual -ne $expected) { throw "LiveKit checksum mismatch: $actual" }
          $target = Join-Path $env:RUNNER_TEMP 'livekit'
          Expand-Archive -Path $archive -DestinationPath $target -Force
          $server = Join-Path $target 'livekit-server.exe'
          $serverHash = (Get-FileHash $server -Algorithm SHA256).Hash.ToLowerInvariant()
          "LIVEKIT_SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIVEKIT_SERVER_SHA256=$serverHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run native LiveKit integration gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'livekit.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'livekit.err'
          $env:LIVEKIT_URL = 'ws://127.0.0.1:7880'
          $env:LIVEKIT_API_KEY = 'dev' + 'key'
          $env:LIVEKIT_API_SECRET = 'local' + '-' + ('x' * 32)
          $env:LIVEKIT_KEYS = "${env:LIVEKIT_API_KEY}: ${env:LIVEKIT_API_SECRET}`n"
          $process = Start-Process -FilePath $env:LIVEKIT_SERVER -ArgumentList '--dev', '--bind', '127.0.0.1' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                if ((Invoke-WebRequest 'http://127.0.0.1:7880/' -UseBasicParsing).Content.Trim() -eq 'OK') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw 'LiveKit did not become ready on loopback'
            }
            $listeners = @(Get-NetTCPConnection -LocalPort 7880 -State Listen -ErrorAction Stop)
            if ($listeners.Count -ne 1 -or $listeners[0].LocalAddress -ne '127.0.0.1' -or $listeners[0].OwningProcess -ne $process.Id) {
              throw 'LiveKit signaling listener is not the owned loopback process'
            }
            python scripts/candidate_e2e_fast_track.py --candidate $env:GITHUB_WORKSPACE --require-livekit --livekit-executable $env:LIVEKIT_SERVER --livekit-executable-sha256 $env:LIVEKIT_SERVER_SHA256 --livekit-pid $process.Id
            if ($LASTEXITCODE -ne 0) { throw "Native release gate failed with exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hermes-realtime-pure-candidate-wheel
          path: ${{ runner.temp }}/revoke-candidate-input
      - name: Qualify archived deterministic equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --frozen --group dev python -m scripts.qualify_deterministic_equivalence `
            --candidate $env:GITHUB_WORKSPACE `
            --livekit-executable $env:LIVEKIT_SERVER --livekit-sha256 $env:LIVEKIT_SERVER_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Deterministic equivalence failed with exit code $LASTEXITCODE" }
      - name: Qualify packaged capture and spool recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wheelRoot = Join-Path $env:RUNNER_TEMP 'revoke-candidate-input/candidate'
          $wheels = @(Get-ChildItem -LiteralPath $wheelRoot -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected one candidate wheel' }
          $manifest = (Get-Content -LiteralPath (Join-Path $wheelRoot 'candidate-wheel.sha256') -Raw).Trim()
          if ($manifest -notmatch '^([0-9a-f]{64})  candidate/hermes_realtime-0\.0\.3-py3-none-any\.whl$') {
            throw 'Candidate wheel digest manifest is not exact'
          }
          $wheelDigest = $Matches[1]
          uv run --frozen --group dev python -m scripts.qualify_revoke_race `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest `
            --livekit-executable $env:LIVEKIT_SERVER --livekit-sha256 $env:LIVEKIT_SERVER_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Revocation qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_capacity_rollover `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest `
            --livekit-executable $env:LIVEKIT_SERVER --livekit-sha256 $env:LIVEKIT_SERVER_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Capacity rollover qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_over_budget_turn `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest `
            --livekit-executable $env:LIVEKIT_SERVER --livekit-sha256 $env:LIVEKIT_SERVER_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Capture overflow qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_spool_crash_matrix `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest
          if ($LASTEXITCODE -ne 0) { throw "Spool crash qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_synthetic_fault_matrix `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest
          if ($LASTEXITCODE -ne 0) { throw "Synthetic fault qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_full_purge_cleanup `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest
          if ($LASTEXITCODE -ne 0) { throw "Full-purge qualification failed with exit code $LASTEXITCODE" }
          uv run --frozen --group dev python -m scripts.qualify_owned_close_faults `
            --candidate $env:GITHUB_WORKSPACE `
            --candidate-wheel $wheels[0].FullName --wheel-sha256 $wheelDigest `
            --livekit-executable $env:LIVEKIT_SERVER --livekit-sha256 $env:LIVEKIT_SERVER_SHA256
          if ($LASTEXITCODE -ne 0) { throw "Owned-close qualification failed with exit code $LASTEXITCODE" }
      - name: Run real-browser self-acceptance gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HERMES_REALTIME_BROWSER_SELF_ACCEPTANCE = '1'
          $env:HERMES_REALTIME_BROWSER_LIVEKIT_SERVER = $env:LIVEKIT_SERVER
          $env:HERMES_REALTIME_BROWSER_LIVEKIT_SERVER_SHA256 = $env:LIVEKIT_SERVER_SHA256
          $env:HERMES_REALTIME_BROWSER_LIVEKIT_LOG_DIR = $env:TEMP
          uv run --frozen --group dev --extra browser-acceptance pytest -q tests/integration/test_browser_self_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw "Browser self-acceptance failed with exit code $LASTEXITCODE" }
      - name: Print sanitized LiveKit failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          python .github/scripts/render_livekit_logs.py `
            "$env:RUNNER_TEMP/livekit.out" `
            "$env:RUNNER_TEMP/livekit.err" `
            "$env:TEMP/browser-livekit.out" `
            "$env:TEMP/browser-livekit.err"
      - name: Remove owner-only Windows test temp
        if: always()
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP "hermes-realtime-owner-only-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $testTemp) {
            Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction Stop
          }
