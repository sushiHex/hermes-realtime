version: 2
updates:
  # Action pins are a review record, not a version: tests/test_release_workflow.py
  # asserts the exact reviewed Node 24 SHAs, their counts, and the uv cache-save
  # ownership block built around one of them. A bot cannot supply that review, so
  # batch it: one grouped pull request needs one review pass.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  # uv owns pyproject.toml and uv.lock together. The pip ecosystem rewrites the
  # manifest without regenerating the lock, so every such pull request failed
  # `uv lock --check` before a single test ran.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # qualification-hermes mirrors the qualified upstream commit pinned by
      # scripts/qualification_hermes_source.py (see tests/test_qualification_candidate_files.py).
      # These roots are derived from that commit rather than chosen here, so a bot bump
      # proposes a version that cannot resolve against it and the pin test refuses.
      # tests/test_dependabot_policy.py binds this list to the group so it cannot drift
      # from pyproject.toml.
      - dependency-name: "concurrent-log-handler"
      - dependency-name: "python-dotenv"
      - dependency-name: "pyyaml"
      - dependency-name: "rich"
      # cryptography is the one root that is also an independent dev constraint, so a blanket
      # ignore would silence dev's own updates. It does not need one. The mirrored pin is
      # ==48.0.1 and the dev range is >=50,<51, two majors apart, so refusing only major
      # updates refuses exactly the derived bump while leaving every patch and minor release
      # dev can actually adopt. Narrowing this to a blanket ignore, or letting the two
      # constraints converge into one major, breaks that separation; the policy test binds
      # both conditions.
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      # The CUDA worker closure's declared roots are reachable from here too, so they are
      # refused here too. uv reads requirements/kokoro-cuda-worker.in as well as
      # pyproject.toml, and kokoro-onnx is additionally pinned in the local extra and moves
      # in lockstep with the worker's package manifest. A root ignored on only one entry is
      # not ignored; it is proposed by the other.
      - dependency-name: "kokoro-onnx"
      - dependency-name: "onnxruntime-gpu"
  # The isolated Kokoro CUDA worker keeps its own hashed closure. A derived entry in it
  # is one a bot can complete: it carries the version and every published wheel hash,
  # which is what `uv pip compile --generate-hashes` emits and what the README sanctions
  # via --upgrade-package. Its two declared roots are not, because they live in
  # requirements/kokoro-cuda-worker.in and only move by recompiling the closure, and
  # kokoro-onnx moves in lockstep with pyproject.toml besides. Attempting them also makes
  # the whole evaluation fail: the pinned kokoro-onnx is a win32-only wheel that cannot
  # resolve on Dependabot's Linux runner.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "kokoro-onnx"
      - dependency-name: "onnxruntime-gpu"
  # Generated browser assets under src/hermes_realtime/client/static/ are tracked, and
  # the release gate compares the committed bytes against a fresh build. A bot cannot
  # regenerate them, so batch the ecosystem: one grouped pull request needs one
  # `npm run build`. Grouping also lets vite and esbuild move together, which is the
  # only way either can move at all once their peer ranges disagree.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns:
          - "*"
