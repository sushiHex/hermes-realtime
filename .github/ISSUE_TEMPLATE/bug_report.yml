name: Bug report
description: Report a reproducible Hermes Realtime defect
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the [public-repository boundary](https://github.com/sushiHex/hermes-realtime/blob/main/CONTRIBUTING.md#public-repository-boundary).
        Do not include credentials, launch fragments, private endpoints or paths, device/account identities, raw audio, transcripts, screenshots, traces, private reports, or user data. Share only minimal, sanitized log or error excerpts.
        Report vulnerabilities through [private vulnerability reporting](https://github.com/sushiHex/hermes-realtime/security/advisories/new) instead of a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and PRs, including closed records.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and private data from all text and attachments.
          required: true
  - type: input
    id: version
    attributes:
      label: Hermes Realtime version or commit
      placeholder: v0.x.y or full commit SHA
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version, if involved
      placeholder: Version or not involved
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give safe, deterministic steps and configuration with sensitive values replaced by [REDACTED].
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste only the smallest redacted error or traceback needed to understand the failure.
      render: text
