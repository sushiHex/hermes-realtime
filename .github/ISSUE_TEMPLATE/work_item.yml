name: Work item
description: Scope one implementation or investigation outcome
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and PRs first. Tracking work does not approve a design.
        Follow the [public-repository boundary](https://github.com/sushiHex/hermes-realtime/blob/main/CONTRIBUTING.md#public-repository-boundary).
        Do not include credentials, launch fragments, private endpoints or paths, device/account identities, raw audio, transcripts, screenshots, traces, private reports, or user data. Share only minimal, sanitized log or error excerpts.
        Report vulnerabilities through [private vulnerability reporting](https://github.com/sushiHex/hermes-realtime/security/advisories/new) instead of a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and PRs, including closed records.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and private data from all text and attachments.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: Work kind
      options:
        - Implementation
        - Investigation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: What changes or becomes known? Explain why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Bound one outcome; independently assignable work can become sub-issues.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and prerequisites
      description: Link reviewed plans, contracts, ADRs, and prerequisite issues. Mark proposals or unknowns explicitly; maintainers add native dependency links.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable completion criteria
      description: Name the required evidence. Investigations need a stopping condition and may reach a negative result.
    validations:
      required: true
