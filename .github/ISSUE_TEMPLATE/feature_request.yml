name: Proposal or decision
description: Propose a public capability or request an explicit design decision
labels: ["decision", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals must be useful outside one private deployment and reproducible without a maintainer's named hardware or accounts.
        Creating an issue does not approve a design. Accepted decisions belong in a reviewed repository plan or ADR.
        Follow the [public-repository boundary](https://github.com/sushiHex/hermes-realtime/blob/main/CONTRIBUTING.md#public-repository-boundary).
        Do not include credentials, launch fragments, private endpoints or paths, device/account identities, raw audio, transcripts, screenshots, traces, private reports, or user data. Share only minimal, sanitized log or error excerpts.
        Report vulnerabilities through [private vulnerability reporting](https://github.com/sushiHex/hermes-realtime/security/advisories/new) instead of a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and PRs, including closed records.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and private data from all text and attachments.
          required: true
  - type: textarea
    id: use_case
    attributes:
      label: Public use case
      description: What user-visible result should become possible?
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing alternatives
      description: Which Hermes Agent, LiveKit, browser, or provider surfaces have you considered?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful scope
      description: Describe the narrowest end-to-end slice, non-goals, and affected contracts or plan/ADR links.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and compatibility considerations
      description: Include authority, cleanup, secret handling, and platform implications.
  - type: textarea
    id: decision
    attributes:
      label: Decision requested and supporting evidence
      description: State the exact choice, prerequisites, and evidence needed to accept or decline it. Separate observations from hypotheses.
    validations:
      required: true
